
# trigger:
# - main

pool:
  vmImage: ubuntu-latest

# =========================================================
# VARIABLES
# =========================================================
#
# Values below follow the same "hardcode it, no placeholders" convention
# used everywhere else in this repo (ACR name, Postgres FQDN, etc). They
# are safe to hardcode because none of them are secrets - the only real
# secret (the Postgres password) never appears in this file: it is
# generated by Terraform, pushed into Key Vault, and read back by the
# AzureKeyVault@2 task at deploy time.
#
# subscription_id is NOT passed from here - Azure DevOps secret pipeline
# variables can't be expanded into a task's `commandOptions` input (only
# into script env: mappings), so it lives in terraform/terraform.tfvars
# and Terraform picks it up automatically.

variables:

  # Azure service connections
  acrServiceConnection: 'credpayacr-connection'
  azureServiceConnection: 'Manual connection'

  # ACR resource name (not the service connection name above) - needed for
  # `az aks update --attach-acr`, which takes the registry's own name.
  acrName: 'credpayacrs9'

  # Image tag - every build is pushed as both $(tag) and :latest
  tag: '$(Build.BuildId)'

  # Repositories in ACR
  frontendRepository: 'credpay/frontend'
  userRepository: 'credpay/user-service'
  paymentRepository: 'credpay/payment-service'

  # Terraform remote state backend
  tfStateRG: 'credpaybaserg'
  tfStateStorage: 'credpaystatesa1'
  tfStateContainer: 'statefile'
  tfStateKey: 'credpay.terraform.tfstate'

  # AKS cluster - deterministic names from terraform/main.tf's
  # name_prefix = "credpay" (rg-credpay / aks-credpay)
  aksResourceGroup: 'credpaybaserg'
  aksClusterName: 'aks-credpays2'
  k8sNamespace: 'credpay'

  # Azure Key Vault - created out-of-band (like the ACR), in the CredProj
  # bootstrap RG (same RG as the Terraform state storage account, not
  # rg-credpay). Terraform writes the Postgres secrets into it; the
  # pipeline reads them back below.
  keyVaultName: 'credpaykv2'
  keyVaultResourceGroup: 'credpaybaserg'

# =========================================================
# STAGES
# =========================================================

stages:

# =========================================================
# STAGE 1 - TERRAFORM
# Provisions/updates AKS, PostgreSQL, networking, Log Analytics, and
# pushes the PostgreSQL credentials into the existing Azure Key Vault.
# =========================================================

- stage: Terraform
  displayName: Terraform Infrastructure

  jobs:

  - job: TerraformApply
    displayName: Terraform Init & Apply

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: latest

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: azurerm
        command: init
        workingDirectory: terraform
        backendServiceArm: $(azureServiceConnection)
        backendAzureRmResourceGroupName: $(tfStateRG)
        backendAzureRmStorageAccountName: $(tfStateStorage)
        backendAzureRmContainerName: $(tfStateContainer)
        backendAzureRmKey: $(tfStateKey)
    # - task: TerraformTask@5
    #   displayName: Terraform Apply (infra + push secrets to Key Vault)
    #   inputs:
    #     provider: azurerm
    #     command: destroy
    #     workingDirectory: terraform
    #     commandOptions: >-
    #       -auto-approve
    #     environmentServiceNameAzureRM: $(azureServiceConnection)


    #########################################################
    # Apply infra. subscription_id comes from terraform.tfvars (see the
    # note at the top of this file); commandOptions only overrides the
    # Key Vault coordinates so they stay in sync with the pipeline
    # variables the Deploy stage reads secrets back with, below.
    #########################################################
    - task: TerraformTask@5
      displayName: Terraform Destroy
      inputs:
        provider: azurerm
        command: destroy
        workingDirectory: terraform
        commandOptions: >-
          -auto-approve
          -var="key_vault_name=$(keyVaultName)"
          -var="key_vault_resource_group_name=$(keyVaultResourceGroup)"
        environmentServiceNameAzureRM: $(azureServiceConnection)

    #########################################################
    # Print the outputs so they're visible in the pipeline log
    # (the values themselves are also already hardcoded as
    # pipeline variables above - this step is just for visibility).
    #########################################################
    - task: TerraformTask@5
      displayName: Show Terraform Outputs
      inputs:
        provider: azurerm
        command: output
        workingDirectory: terraform
        environmentServiceNameAzureRM: $(azureServiceConnection)

# =========================================================
# STAGE 2 - BUILD & PUSH DOCKER IMAGES
# Unchanged from the original pipeline - reuses the existing Dockerfiles
# as-is. Runs after Terraform so infra always exists before images do.
# =========================================================

- stage: DockerBuild
  displayName: Docker Build & Push
  dependsOn: Terraform

  jobs:

  - job: BuildPushImages
    displayName: Build Docker Images

    steps:

    - checkout: self

    #########################################################
    # Display Build Information
    #########################################################

    - script: |
        echo "Repository : $(Build.Repository.Name)"
        echo "Branch     : $(Build.SourceBranch)"
        echo "Build ID   : $(Build.BuildId)"
        echo "Image Tag  : $(tag)"
      displayName: Build Information

    #########################################################
    # FRONTEND
    #########################################################

    - task: Docker@2
      displayName: Build & Push Frontend Image

      inputs:
        command: buildAndPush
        containerRegistry: $(acrServiceConnection)
        repository: $(frontendRepository)
        dockerfile: frontend-react/Dockerfile
        buildContext: frontend-react

        tags: |
          $(tag)
          latest

    #########################################################
    # USER SERVICE
    #########################################################

    - task: Docker@2
      displayName: Build & Push User Service Image

      inputs:
        command: buildAndPush
        containerRegistry: $(acrServiceConnection)
        repository: $(userRepository)
        dockerfile: user-service/Dockerfile
        buildContext: user-service

        tags: |
          $(tag)
          latest

    #########################################################
    # PAYMENT SERVICE
    #########################################################

    - task: Docker@2
      displayName: Build & Push Payment Service Image

      inputs:
        command: buildAndPush
        containerRegistry: $(acrServiceConnection)
        repository: $(paymentRepository)
        dockerfile: payment-service/Dockerfile
        buildContext: payment-service

        tags: |
          $(tag)
          latest
